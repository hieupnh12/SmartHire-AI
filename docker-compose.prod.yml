# Production stack for Google Cloud VPS (Compute Engine)
# Usage:
#   cp deploy/.env.production.example deploy/.env.production
#   # edit secrets
#   docker compose -f docker-compose.prod.yml --env-file deploy/.env.production up -d --build

name: smarthire-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smarthire_master
      POSTGRES_USER: ${MASTER_DB_USERNAME:-smarthire_master}
      POSTGRES_PASSWORD: ${MASTER_DB_PASSWORD:?set MASTER_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d smarthire_master"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - internal

  mysql:
    image: mysql:8.4
    container_name: smarthire-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      TENANT_PROVISIONING_PASSWORD: ${TENANT_PROVISIONING_PASSWORD:?set TENANT_PROVISIONING_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/init-provisioner.sh:/docker-entrypoint-initdb.d/init-provisioner.sh:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -uroot"]
      interval: 10s
      timeout: 5s
      retries: 15
    # No host ports — only reachable inside Docker network

  redis:
    image: redis:7-alpine
    container_name: smarthire-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: smarthire-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - internal
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Management UI not published publicly — tunnel via SSH if needed:
    #   ssh -L 15672:localhost:15672 user@VM_IP

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smarthire-backend
    restart: unless-stopped
    env_file:
      - ./deploy/.env.production
    environment:
      MASTER_DB_URL: ${MASTER_DB_URL:-jdbc:postgresql://postgres:5432/smarthire_master}
      MASTER_DB_USERNAME: ${MASTER_DB_USERNAME:-smarthire_master}
      MASTER_DB_PASSWORD: ${MASTER_DB_PASSWORD:?set MASTER_DB_PASSWORD}
      TENANT_CREDENTIALS_KEY: ${TENANT_CREDENTIALS_KEY:?set TENANT_CREDENTIALS_KEY}
      TENANT_MYSQL_BASE_URL: ${TENANT_MYSQL_BASE_URL:-jdbc:mysql://mysql:3306}
      TENANT_PROVISIONING_URL: ${TENANT_PROVISIONING_URL:-jdbc:mysql://mysql:3306/?allowPublicKeyRetrieval=true}
      TENANT_PROVISIONING_USERNAME: ${TENANT_PROVISIONING_USERNAME:-smarthire_provisioner}
      TENANT_PROVISIONING_PASSWORD: ${TENANT_PROVISIONING_PASSWORD:?set TENANT_PROVISIONING_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q UP || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Same-origin API via nginx proxy inside frontend container
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: smarthire-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
      - edge
    ports:
      - "127.0.0.1:8080:80"
    # Host nginx (TLS) proxies :443 → 127.0.0.1:8080
    # Or map 80:80 if TLS is terminated elsewhere

  # Optional: expose only via edge nginx on host — see deploy/nginx/smarthire.conf

volumes:
  postgres_data:
  mysql_data:
  redis_data:
  rabbitmq_data:

networks:
  internal:
    driver: bridge
    internal: false
  edge:
    driver: bridge
