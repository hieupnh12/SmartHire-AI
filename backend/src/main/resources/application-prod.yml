spring:
  jpa:
    show-sql: false

server:
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
    com.smarthire: INFO

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

# Swagger can stay on for staging; lock down via nginx/IP allowlist on prod if needed
springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
