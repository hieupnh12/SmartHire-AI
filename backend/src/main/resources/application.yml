spring:
  application:
    name: smarthire-backend
  servlet:
    multipart:
      max-file-size: ${CV_MAX_FILE:10MB}
      max-request-size: ${CV_MAX_REQUEST:12MB}
  config:
    import: optional:file:.env[.properties]
  jpa:
    hibernate:
      ddl-auto: auto
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration/master
    validate-on-migrate: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        auto-startup: ${RABBIT_LISTENERS_ENABLED:true}
        # Worker pool per backend/consumer instance
        concurrency: ${RABBIT_CONCURRENCY:3}
        max-concurrency: ${RABBIT_MAX_CONCURRENCY:10}
        prefetch: 1
        default-requeue-rejected: false
    template:
      retry:
        enabled: true
        initial-interval: 1s
        max-attempts: 3
        multiplier: 2.0

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: true
    rabbit:
      enabled: true
    db:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    root: INFO
    com.smarthire: DEBUG
    com.zaxxer.hikari: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

app:
  datasource:
    master:
      driver-class-name: org.postgresql.Driver
      url: ${MASTER_DB_URL:jdbc:postgresql://127.0.0.1:5432/smarthire_master}
      username: ${MASTER_DB_USERNAME:smarthire_master}
      password: ${MASTER_DB_PASSWORD:smarthire_master_secret}
      hikari:
        maximum-pool-size: ${MASTER_DB_POOL_SIZE:10}
        minimum-idle: 1
  tenant:
    credentials-key: ${TENANT_CREDENTIALS_KEY}
    base-domain: ${TENANT_BASE_DOMAIN:smarthire.top}
    mysql-base-url: ${TENANT_MYSQL_BASE_URL:jdbc:mysql://127.0.0.1:3306}
    mysql-options: ${TENANT_MYSQL_OPTIONS:sslMode=PREFERRED&allowPublicKeyRetrieval=true}
    pool-size: ${TENANT_DB_POOL_SIZE:5}
    max-pools: ${TENANT_MAX_POOLS:20}
    provisioning:
      url: ${TENANT_PROVISIONING_URL:jdbc:mysql://127.0.0.1:3306/}
      username: ${TENANT_PROVISIONING_USERNAME:smarthire_provisioner}
      password: ${TENANT_PROVISIONING_PASSWORD:}
  bootstrap:
    admin-enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  redis:
    ttl:
      job-list-seconds: 120
      dashboard-seconds: 60
      otp-seconds: 600
      match-score-seconds: 1800
      rate-limit-window-seconds: 60
  rabbitmq:
    exchanges:
      cv-parse: cv.parse
      cv-extract: cv.extract
      cv-analysis: cv.analysis
      cv-matching: cv.matching
      interview-questions: interview.questions
      interview-stt: interview.stt
      interview-nlp: interview.nlp
      interview-score: interview.score
      assessment-code-grade: assessment.code.grade
      practice-feedback: practice.feedback
      notify-email: notify.email
      auth-email-otp: auth.email.otp
      job-events: job.events
    queues:
      cv-parse: cv.parse.q
      cv-extract: cv.extract.q
      cv-analysis: cv.analysis.q
      cv-matching: cv.matching.q
      interview-questions: interview.questions.q
      interview-stt: interview.stt.q
      interview-nlp: interview.nlp.q
      interview-score: interview.score.q
      assessment-code-grade: assessment.code.grade.q
      practice-feedback: practice.feedback.q
      notify-email: notify.email.q
      auth-email-otp: auth.email.otp.q
      job-events: job.events.q
  cv:
    cloudinary-cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    cloudinary-api-key: ${CLOUDINARY_API_KEY:}
    cloudinary-api-secret: ${CLOUDINARY_API_SECRET:}
    max-file-bytes: ${CV_MAX_FILE_BYTES:10485760}
  ai:
    timeout-seconds: ${CV_AI_TIMEOUT_SECONDS:30}
    gemini:
      api-key: ${GEMINI_API_KEY:}
    models:
      cv-parsing: ${GEMINI_MODEL:gemini-2.0-flash}

smarthire:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  invite:
    public-origin: ${INVITE_PUBLIC_ORIGIN:http://localhost:5173}
    expire-hours: ${INVITE_EXPIRE_HOURS:72}
  jobs:
    close-scan-enabled: ${JOB_CLOSE_SCAN_ENABLED:true}
    close-scan-ms: ${JOB_CLOSE_SCAN_MS:60000}

