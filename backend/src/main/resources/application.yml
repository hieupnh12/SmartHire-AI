spring:
  application:
    name: smarthire-backend
  servlet:
    multipart:
      max-file-size: ${CV_MAX_FILE:10MB}
      max-request-size: ${CV_MAX_REQUEST:12MB}
  config:
    import: optional:file:.env[.properties]
  jpa:
    hibernate:
      ddl-auto: auto
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration/master
    validate-on-migrate: false
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
      repositories:
        enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        auto-startup: ${RABBIT_LISTENERS_ENABLED:true}
        # Worker pool per backend/consumer instance
        concurrency: ${RABBIT_CONCURRENCY}
        max-concurrency: ${RABBIT_MAX_CONCURRENCY}
        prefetch: 1
        default-requeue-rejected: false
    template:
      retry:
        enabled: true
        initial-interval: 1s
        max-attempts: 3
        multiplier: 2.0

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:true}
    rabbit:
      enabled: ${RABBIT_HEALTH_ENABLED:true}
    db:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    root: INFO
    com.smarthire: DEBUG
    com.zaxxer.hikari: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

app:
  datasource:
    master:
      driver-class-name: org.postgresql.Driver
      url: ${MASTER_DB_URL}
      username: ${MASTER_DB_USERNAME}
      password: ${MASTER_DB_PASSWORD}
      hikari:
        maximum-pool-size: ${MASTER_DB_POOL_SIZE}
        minimum-idle: 1
  tenant:
    credentials-key: ${TENANT_CREDENTIALS_KEY}
    base-domain: ${TENANT_BASE_DOMAIN}
    mysql-base-url: ${TENANT_MYSQL_BASE_URL}
    mysql-options: ${TENANT_MYSQL_OPTIONS}
    pool-size: ${TENANT_DB_POOL_SIZE}
    max-pools: ${TENANT_MAX_POOLS}
    provisioning:
      url: ${TENANT_PROVISIONING_URL}
      username: ${TENANT_PROVISIONING_USERNAME}
      password: ${TENANT_PROVISIONING_PASSWORD}
  bootstrap:
    admin-enabled: ${BOOTSTRAP_ADMIN_ENABLED}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD}
  cors:
    allowed-origins: ${CORS_ORIGINS}
  redis:
    ttl:
      job-list-seconds: 120
      dashboard-seconds: 60
      otp-seconds: 600
      match-score-seconds: 1800
      rate-limit-window-seconds: 60
  rabbitmq:
    exchanges:
      cv-parse: cv.parse
      cv-extract: cv.extract
      cv-analysis: cv.analysis
      cv-matching: cv.matching
      interview-questions: interview.questions
      interview-stt: interview.stt
      interview-nlp: interview.nlp
      interview-score: interview.score
      assessment-code-grade: assessment.code.grade
      practice-feedback: practice.feedback
      notify-email: notify.email
      auth-email-otp: auth.email.otp
      job-events: job.events
      job-expiry: job.expiry
    queues:
      cv-parse: cv.parse.q
      cv-extract: cv.extract.q
      cv-analysis: cv.analysis.q
      cv-matching: cv.matching.q
      interview-questions: interview.questions.q
      interview-stt: interview.stt.q
      interview-nlp: interview.nlp.q
      interview-score: interview.score.q
      interview-email: tenant.interview.email
      assessment-code-grade: assessment.code.grade.q
      practice-feedback: practice.feedback.q
      notify-email: notify.email.q
      auth-email-otp: auth.email.otp.q
      job-events: job.events.q
      job-expiry: job.expiry.q
  cv:
    cloudinary-cloud-name: ${CLOUDINARY_CLOUD_NAME}
    cloudinary-api-key: ${CLOUDINARY_API_KEY}
    cloudinary-api-secret: ${CLOUDINARY_API_SECRET}
    max-file-bytes: ${CV_MAX_FILE_BYTES:10485760}
  ai:
    timeout-seconds: ${CV_AI_TIMEOUT_SECONDS:30}
    gemini:
      api-key: ${GEMINI_API_KEY:}
    models:
      cv-parsing: ${GEMINI_MODEL:gemini-2.0-flash}
    # Dedicated Gemini credentials for AI Interview (INT-01..05) — not shared with CV parsing
    interview:
      api-key: ${AI_INTERVIEW_GEMINI_API_KEY:}
      model: ${AI_INTERVIEW_GEMINI_MODEL:gemini-2.0-flash}
      base-url: ${AI_INTERVIEW_GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models}
      timeout-seconds: ${AI_INTERVIEW_TIMEOUT_SECONDS:60}

smarthire:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  invite:
    public-origin: ${INVITE_PUBLIC_ORIGIN:http://localhost:5173}
    expire-hours: ${INVITE_EXPIRE_HOURS:72}
  jobs:
    close-scan-enabled: ${JOB_CLOSE_SCAN_ENABLED:true}
    close-scan-ms: ${JOB_CLOSE_SCAN_MS:60000}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE}
  hash-secret: ${VNPAY_HASH_SECRET}
  pay-url: ${VNPAY_PAY_URL}
  return-url: ${VNPAY_RETURN_URL}
  version: "2.1.0"
  command: "pay"

paypal:
  client-id: ${PAYPAL_CLIENT_ID}
  client-secret: ${PAYPAL_SECRET}
  mode: ${PAYPAL_MODE}
