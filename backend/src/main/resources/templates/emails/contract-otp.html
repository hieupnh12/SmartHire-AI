<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mã OTP Xác Thực Ký Số</title>
    <style>
        body { font-family: 'Inter', Arial, sans-serif; line-height: 1.6; color: #333; background-color: #f9fafb; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background-color: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 30px; }
        .header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid #e5e7eb; padding-bottom: 20px; }
        .header h1 { color: #4f46e5; margin: 0; font-size: 24px; }
        .content { margin-bottom: 30px; text-align: center; }
        .otp-box { background-color: #eef2ff; color: #4338ca; font-size: 32px; font-weight: bold; letter-spacing: 5px; padding: 20px; border-radius: 8px; margin: 30px 0; display: inline-block; }
        .footer { text-align: center; color: #6b7280; font-size: 14px; margin-top: 20px; border-top: 1px solid #e5e7eb; padding-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Mã OTP Ký Số Điện Tử</h1>
        </div>
        <div class="content">
            <p>Kính gửi Quý khách hàng,</p>
            <p>Để hoàn tất quá trình ký số trực tuyến cho hợp đồng <strong><span th:text="${contractNumber}"></span></strong>, vui lòng sử dụng mã OTP sau:</p>
            
            <div class="otp-box" th:text="${otpCode}"></div>

            <p style="color: #ef4444; font-size: 14px;">Mã OTP này sẽ hết hạn sau 15 phút. Tuyệt đối không chia sẻ mã này cho bất kỳ ai.</p>
        </div>
        <div class="footer">
            <p>Trân trọng,<br/><strong>Đội ngũ SmartHire-AI</strong></p>
        </div>
    </div>
</body>
</html>
