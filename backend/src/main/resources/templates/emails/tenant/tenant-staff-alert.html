<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Thông Báo Nội Bộ - Tuyển Dụng</title>
    <style>
        body { margin: 0; padding: 0; background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1e293b; line-height: 1.6; }
        .wrapper { width: 100%; background-color: #f1f5f9; padding: 32px 12px; }
        .container { max-width: 620px; margin: 0 auto; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .header { padding: 22px 32px 16px; background-color: #0f172a; text-align: left; }
        .brand-title { font-size: 18px; font-weight: 800; color: #ffffff; margin: 0; }
        .brand-subtitle { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.8px; margin-top: 3px; }
        .body-content { padding: 28px 32px; }
        .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 9999px; text-transform: uppercase; background: #e0e7ff; color: #3730a3; border: 1px solid #c7d2fe; margin-bottom: 14px; }
        .badge-green { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
        .badge-amber { background: #fffbeb; color: #b45309; border-color: #fde68a; }
        .headline { font-size: 19px; font-weight: 700; color: #0f172a; margin: 0 0 16px; }
        .paragraph { font-size: 14px; color: #334155; margin: 0 0 14px; }
        .admin-card { background-color: #f8fafc; border: 1px solid #e2e8f0; border-left: 4px solid #3b82f6; border-radius: 6px; padding: 16px 20px; margin: 20px 0; }
        .admin-table { width: 100%; border-collapse: collapse; }
        .admin-table td { padding: 6px 0; font-size: 13px; }
        .admin-label { color: #64748b; width: 35%; font-weight: 500; }
        .admin-value { color: #0f172a; font-weight: 600; }
        .btn-wrapper { text-align: center; margin: 26px 0 20px; }
        .btn-primary { display: inline-block; background-color: #0f172a; color: #ffffff !important; font-size: 14px; font-weight: 600; padding: 12px 28px; border-radius: 8px; text-decoration: none; }
        .footer { background-color: #f8fafc; border-top: 1px solid #e2e8f0; padding: 20px 32px; font-size: 12px; color: #64748b; text-align: center; }
        .footer-note { margin-top: 4px; font-size: 11px; color: #94a3b8; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="container">
        <div class="header">
            <h1 class="brand-title" th:text="${brand}">Tên Doanh Nghiệp</h1>
            <div class="brand-subtitle">Hệ Thống Tuyển Dụng &bull; Bảng Điều Khiển Nội Bộ</div>
        </div>
        <div class="body-content">
            <div th:class="'badge ' + (${badgeColor == 'green'} ? 'badge-green' : (${badgeColor == 'amber'} ? 'badge-amber' : ''))" th:text="${badgeText}">Cập Nhật Tuyển Dụng</div>
            <h2 class="headline" th:text="${headline}">Thông Báo Tuyển Dụng Mới</h2>
            <p class="paragraph" th:if="${recipientName != null}">Kính gửi <strong th:text="${recipientName}">Anh/Chị phụ trách</strong>,</p>
            <div th:each="p : ${paragraphs}">
                <p class="paragraph" th:text="${p}"></p>
            </div>
            <div class="admin-card" th:if="${details != null and !details.isEmpty()}">
                <table class="admin-table">
                    <tr th:each="row : ${details}">
                        <td class="admin-label" th:text="${row.label}">Mục:</td>
                        <td class="admin-value" th:text="${row.value}">Giá trị</td>
                    </tr>
                </table>
            </div>
            <div class="btn-wrapper" th:if="${ctaUrl != null and !ctaUrl.isEmpty()}">
                <a th:href="${ctaUrl}" class="btn-primary" target="_blank" th:text="${ctaLabel != null ? ctaLabel : 'Mở Trang Quản Trị'}">Mở Trang Quản Trị</a>
            </div>
        </div>
        <div class="footer">
            <div>Email tự động gửi đến thành viên ban tuyển dụng của <strong th:text="${brand}">Doanh Nghiệp</strong>.</div>
            <div class="footer-note">&copy; 2026 SmartHire-AI &bull; Cổng Quản Trị Tuyển Dụng Doanh Nghiệp</div>
        </div>
    </div>
</div>
</body>
</html>
