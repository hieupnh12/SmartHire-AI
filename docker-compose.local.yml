# docker-compose.local.yml
services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  rabbitmq:
    build:
      context: ./deploy/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"